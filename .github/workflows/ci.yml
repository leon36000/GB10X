name: host-logic-ci

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

concurrency:
  group: host-logic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-host-logic:
    name: Rust host-logic gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Cargo lockfile is committed and valid
        run: |
          git ls-files --error-unmatch Cargo.lock
          git diff --exit-code -- Cargo.lock
          cargo metadata --locked --format-version 1 >/dev/null
      - name: Rust and CI provenance are pinned
        run: |
          grep -Fq 'channel = "1.98.0"' rust-toolchain.toml
          grep -Fq 'rust-version = "1.98.0"' Cargo.toml
          test "$(grep -Ec '^[[:space:]]+runs-on: ubuntu-24\.04$' .github/workflows/ci.yml)" -eq 2
          test "$(grep -Ec '^[[:space:]]+- uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262$' .github/workflows/ci.yml)" -eq 2
          test "$(grep -Ec '^[[:space:]]+- uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c$' .github/workflows/ci.yml)" -eq 2
          test "$(grep -Ec '^[[:space:]]+toolchain: 1\.98\.0$' .github/workflows/ci.yml)" -eq 2
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Native build environment guard
        run: |
          guard='scripts/check-gb10-build-env.sh'
          bash "$guard" "$PWD"

          set +e
          output=$(RUSTFLAGS='-Ctarget-cpu=native' bash "$guard" "$PWD" 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -Fq 'RUSTFLAGS' <<<"$output"

          mkdir -p .cargo
          printf '[build]\nrustflags = ["-Ctarget-cpu=native"]\n' > .cargo/config.toml
          set +e
          output=$(bash "$guard" "$PWD" 2>&1)
          status=$?
          set -e
          rm -rf .cargo
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -Fq 'untracked Cargo config' <<<"$output"

          mkdir -p ../.cargo
          printf '[build]\nrustflags = ["-Ctarget-cpu=native"]\n' > ../.cargo/config.toml
          set +e
          output=$(bash "$guard" "$PWD" 2>&1)
          status=$?
          set -e
          rm -rf ../.cargo
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -Fq 'inherited Cargo config' <<<"$output"

          temp_cargo_home=$(mktemp -d)
          printf '[build]\nrustflags = ["-Ctarget-cpu=native"]\n' > "$temp_cargo_home/config.toml"
          set +e
          output=$(CARGO_HOME="$temp_cargo_home" bash "$guard" "$PWD" 2>&1)
          status=$?
          set -e
          rm -rf "$temp_cargo_home"
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -Fq 'CARGO_HOME config' <<<"$output"
      - name: Native verification script syntax
        run: bash -n scripts/verify-gb10-m2.sh
      - name: Native verification script rejects x86 CI
        run: |
          set +e
          output=$(bash scripts/verify-gb10-m2.sh 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -Fq "requires Linux aarch64" <<<"$output"
      - name: Native verifier guards environment before build isolation
        run: |
          guard_line=$(grep -nF 'bash scripts/check-gb10-build-env.sh "$repo_root"' scripts/verify-gb10-m2.sh | cut -d: -f1)
          target_line=$(grep -nF 'native_target_dir="$(mktemp -d' scripts/verify-gb10-m2.sh | cut -d: -f1)
          test -n "$guard_line"
          test -n "$target_line"
          test "$guard_line" -lt "$target_line"
      - name: Native verifier isolates build artifacts
        run: |
          grep -Fq 'native_target_dir="$(mktemp -d' scripts/verify-gb10-m2.sh
          grep -Fq 'export CARGO_TARGET_DIR="$native_target_dir"' scripts/verify-gb10-m2.sh
          grep -Fq 'find "$CARGO_TARGET_DIR/debug/build"' scripts/verify-gb10-m2.sh
          grep -Fq 'trap cleanup_native_target EXIT' scripts/verify-gb10-m2.sh
      - name: Native verifier binds pinned Qwen source bytes
        run: |
          grep -Fq 'model_dir="${GB10X_QWEN_MODEL_DIR:-}"' scripts/verify-gb10-m2.sh
          grep -Fq -- '--model-dir)' scripts/verify-gb10-m2.sh
          grep -Fq 'source-verify --model-dir "$model_dir"' scripts/verify-gb10-m2.sh
          grep -Fq 'model-source.json' scripts/verify-gb10-m2.sh
          grep -Fq '"model_source": json.loads(model_source_path.read_text' scripts/verify-gb10-m2.sh
      - name: Native verifier uses locked Rust dependencies
        run: |
          grep -Fq 'cargo metadata --locked' scripts/verify-gb10-m2.sh
          test "$(grep -Fc 'cargo run --locked' scripts/verify-gb10-m2.sh)" -ge 2
          test "$(grep -Fc 'cargo test --locked' scripts/verify-gb10-m2.sh)" -ge 3
      - name: Unit tests
        run: cargo test --locked --workspace --all-targets
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Release build
        run: cargo build --locked --workspace --release

  cuda-sm121a-compile:
    name: CUDA 12.9 sm_121a compile-only gate
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:12.9.1-devel-ubuntu24.04@sha256:020bc241a628776338f4d4053fed4c38f6f7f3d7eb5919fecb8de313bb8ba47c
    steps:
      - name: Bootstrap CUDA build container
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Record CUDA compiler
        run: nvcc --version
      - name: Compile native CUDA probe without executing a GPU
        run: cargo test --locked -p gb10x-cuda --features native-cuda --all-targets --no-run
      - name: Verify native probe JSON contract without executing CUDA
        run: cargo test --locked -p gb10x-tools --features native-cuda --test native_probe_json
      - name: Compile native tooling without executing a GPU
        run: cargo test --locked -p gb10x-tools --features native-cuda --all-targets --no-run
